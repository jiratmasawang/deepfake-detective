<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1f">
<title>Deepfake Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* =====================================================================
   Deepfake Detective v2 — Dark navy + electric blue/violet
   โทน: พื้นกรมท่าเข้ม คลื่นแสงฟ้า-ม่วง การ์ดกระจกมุมโค้ง ปุ่มไล่สีฟ้า
===================================================================== */
:root {
  --bg: #070b1f;
  --bg-2: #0b1130;
  --card: rgba(23, 33, 82, .55);
  --card-2: rgba(30, 43, 104, .55);
  --card-solid: #121a43;
  --line: rgba(110, 140, 255, .16);
  --line-2: rgba(120, 150, 255, .3);
  --blue: #3b82f6;
  --blue-2: #5aa9ff;
  --cyan: #5ad1ff;
  --violet: #8b5cf6;
  --text: #eef2ff;
  --text-2: #b3bce0;
  --text-3: #8089b3;
  --good: #2fd38a;
  --warn: #fbbf24;
  --bad: #ff4d6d;
  --r: 18px;
  --r-lg: 24px;
  --nav-h: 76px;
  --grad: linear-gradient(90deg, #4cb4ff 0%, #3b82f6 55%, #4f6bff 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  font-family: "Inter", "Anuphan", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh; min-height: 100dvh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
img, svg { display: block; }
.hidden { display: none !important; }

/* ---------- พื้นหลังคลื่นแสง ---------- */
#bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#bgfx svg { position: absolute; width: 160%; left: -30%; }
#bgfx .w1 { bottom: -6%; opacity: .9; }
#bgfx .w2 { top: -10%; transform: scaleY(-1); opacity: .5; }
#bgfx::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(60% 40% at 80% 10%, rgba(79,107,255,.18), transparent 70%),
              radial-gradient(50% 35% at 10% 90%, rgba(59,130,246,.16), transparent 70%);
}

#app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }
.page { display: none; padding: calc(18px + env(safe-area-inset-top)) 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); min-height: 100vh; min-height: 100dvh; }
.page.active { display: block; animation: pageIn .28s ease both; }
.page.full { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- ตัวอักษร ---------- */
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
h2 { font-size: 1.12rem; font-weight: 700; line-height: 1.4; }
h3 { font-size: 1rem; font-weight: 600; line-height: 1.45; }
.muted { color: var(--text-2); font-size: .94rem; }
.dim { color: var(--text-3); font-size: .84rem; }
.wordmark { font-weight: 800; letter-spacing: -.02em; line-height: 1.02; }
.wordmark .a { color: #fff; display: block; }
.wordmark .b { display: block; background: linear-gradient(90deg, #5ad1ff, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- การ์ด / ปุ่ม ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 54px; border-radius: 16px; padding: 0 18px;
  background: var(--grad); color: #fff; font-weight: 600; font-size: 1.02rem;
  box-shadow: 0 10px 30px -10px rgba(59,130,246,.75), inset 0 1px 0 rgba(255,255,255,.25);
  transition: transform .12s ease, filter .12s ease;
}
.btn:active { transform: scale(.985); }
.btn:disabled { filter: grayscale(.5) brightness(.75); cursor: default; }
.btn .ic { width: 22px; height: 22px; }
.btn.ghost { background: rgba(255,255,255,.04); border: 1px solid var(--line); box-shadow: none; }
.btn.danger { background: rgba(255,77,109,.08); border: 1px solid rgba(255,77,109,.35); color: #ff8da2; box-shadow: none; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; color: var(--text); }
.icon-btn .ic { width: 24px; height: 24px; }
.icon-btn:active { background: rgba(255,255,255,.06); }
.ic { width: 22px; height: 22px; flex: none; }
.link { color: var(--blue-2); font-weight: 600; font-size: .92rem; display: inline-flex; align-items: center; gap: 2px; }
.link .ic { width: 16px; height: 16px; }

/* ---------- ฟอร์ม ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: .9rem; color: var(--text-2); margin-bottom: 7px; font-weight: 500; }
input[type=text], input[type=password], input[type=url], input[type=search], textarea {
  width: 100%; background: rgba(5, 9, 30, .65); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 15px; font-size: 1rem; outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
input:focus, textarea:focus { border-color: var(--blue-2); box-shadow: 0 0 0 3px rgba(90,169,255,.18); }
input::placeholder, textarea::placeholder { color: var(--text-3); }

.seg { display: flex; gap: 6px; padding: 5px; background: rgba(5, 9, 30, .55); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 16px; }
.seg button { flex: 1; min-height: 42px; border-radius: 12px; color: var(--text-2); font-weight: 600; font-size: .94rem; display: flex; align-items: center; justify-content: center; gap: 7px; }
.seg button .ic { width: 18px; height: 18px; }
.seg button.on { background: var(--grad); color: #fff; box-shadow: 0 6px 18px -8px rgba(59,130,246,.9); }

.errbox { background: rgba(255,77,109,.1); border: 1px solid rgba(255,77,109,.3); color: #ffb3c0; border-radius: 14px; padding: 12px 14px; font-size: .92rem; }
.note { display: flex; gap: 12px; align-items: flex-start; background: rgba(20, 30, 80, .6); border: 1px solid var(--line); border-radius: 16px; padding: 13px 15px; font-size: .88rem; color: var(--text-2); }
.note .ic { width: 24px; height: 24px; color: var(--blue-2); }
.disclaimer { margin-top: 16px; font-size: .82rem; color: var(--text-3); line-height: 1.6; text-align: center; }
.hr-text { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: .85rem; margin: 16px 0; }
.hr-text::before, .hr-text::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- หัวหน้าย่อย ---------- */
.topbar { display: flex; align-items: center; gap: 6px; min-height: 48px; margin: 0 -8px 12px; }
.topbar h1 { font-size: 1.22rem; flex: 1; display: flex; align-items: center; gap: 10px; }
.topbar h1 .ic { width: 26px; height: 26px; }
.topbar .sp { flex: 1; }

/* ---------- แถบล่าง ---------- */
#nav {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 20;
  width: 100%; max-width: 520px; display: none;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(7,11,31,0), rgba(7,11,31,.92) 30%);
}
#nav .bar { display: flex; background: rgba(14, 21, 58, .88); border: 1px solid var(--line); border-radius: 22px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 6px; }
#nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border-radius: 16px; color: var(--text-3); font-size: .76rem; font-weight: 600; }
#nav button .ic { width: 24px; height: 24px; }
#nav button.on { color: var(--blue-2); }

/* ---------- Splash ---------- */
#page-splash { display: none; padding: 0; }
#page-splash.active { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 100vh; min-height: 100dvh; padding: 40px 24px; }
.splash-mark { position: relative; width: 230px; height: 230px; display: grid; place-items: center; margin-bottom: 34px; }
.splash-mark img { width: 170px; height: 170px; filter: drop-shadow(0 0 28px rgba(79,125,255,.55)); animation: float 4s ease-in-out infinite; }
.brk { position: absolute; width: 34px; height: 34px; border: 3px solid #3b82f6; }
.brk.tl { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.brk.tr { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
.brk.bl { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
.brk.br { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
.px { position: absolute; width: 9px; height: 9px; background: #3b5bdb; opacity: .55; border-radius: 1px; }
.splash-word { font-size: 2.65rem; }
.splash-tag { margin-top: 16px; font-size: 1.12rem; color: var(--text-2); line-height: 1.6; }
.splash-bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(90,169,255,.15); margin-top: 64px; overflow: hidden; }
.splash-bar i { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 4px; animation: load 1.5s ease forwards; }
@keyframes load { to { width: 100%; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* ---------- Login ---------- */
.auth-head { text-align: center; padding: 26px 0 24px; }
.auth-head img { width: 96px; height: 96px; margin: 0 auto 14px; filter: drop-shadow(0 0 20px rgba(79,125,255,.5)); }
.auth-head .wordmark { font-size: 1.9rem; }

/* ---------- Home ---------- */
.home-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.home-head img { width: 46px; height: 46px; }
.home-head .wordmark { font-size: 1.12rem; flex: 1; }
.avatar-btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--text-2); display: grid; place-items: center; color: var(--text-2); }
.avatar-btn .ic { width: 24px; height: 24px; }
.hero {
  position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 22px 18px 22px 20px;
  background: linear-gradient(135deg, rgba(41, 60, 160, .75), rgba(26, 37, 105, .7));
  border: 1px solid var(--line-2); display: flex; align-items: center; gap: 8px; min-height: 168px;
}
.hero::before { content: ""; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(139,92,246,.35), transparent 70%); }
.hero .txt { flex: 1; position: relative; }
.hero h2 { font-size: 1.36rem; line-height: 1.3; font-weight: 800; }
.hero p { margin-top: 10px; color: var(--text-2); font-size: .9rem; line-height: 1.5; }
.hero .art { width: 118px; height: 118px; flex: none; position: relative; }
.scan-btn { margin-top: 14px; min-height: 58px; font-size: 1.06rem; border-radius: 20px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 12px; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tool { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 6px 13px; display: flex; flex-direction: column; align-items: center; gap: 9px; font-size: .84rem; font-weight: 600; color: var(--text); text-align: center; line-height: 1.3; }
.tool .ic { width: 28px; height: 28px; color: #d6defc; }
.tool:active { background: var(--card-2); }
.rule { display: flex; gap: 14px; align-items: flex-start; padding: 15px; margin-bottom: 10px; }
.rule-num { width: 36px; height: 36px; flex: none; border-radius: 11px; display: grid; place-items: center; font-weight: 800; background: var(--grad); box-shadow: 0 6px 16px -6px rgba(59,130,246,.9); }
.rule p { margin-top: 4px; font-size: .88rem; color: var(--text-2); line-height: 1.6; }

/* ---------- Scan ---------- */
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 26px 16px; text-align: center; background: rgba(20, 30, 80, .35); }
.drop .big { width: 58px; height: 58px; margin: 0 auto 12px; border-radius: 18px; display: grid; place-items: center; background: rgba(59,130,246,.16); color: var(--blue-2); }
.drop .big .ic { width: 30px; height: 30px; }
.drop h3 { margin-bottom: 4px; }
.picked { margin-top: 12px; font-size: .88rem; color: var(--text-2); word-break: break-all; }
.preview-video { width: 100%; max-height: 220px; border-radius: 14px; margin-top: 12px; background: #000; object-fit: cover; }

/* ---------- Analyzing ---------- */
.an-wrap { text-align: center; padding-top: 8px; }
.frame { position: relative; width: 240px; height: 180px; margin: 8px auto 30px; padding: 10px; }
.frame .media { width: 100%; height: 100%; border-radius: 14px; overflow: hidden; background: linear-gradient(160deg, #1a2670, #0c1240); display: grid; place-items: center; position: relative; }
.frame .media video, .frame .media img { width: 100%; height: 100%; object-fit: cover; }
.frame .media .txtprev { padding: 14px; font-size: .82rem; color: var(--text-2); text-align: left; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.frame .media::after { content: ""; position: absolute; left: 0; right: 0; height: 40%; top: -40%; background: linear-gradient(180deg, transparent, rgba(90,169,255,.35), transparent); animation: sweep 1.8s linear infinite; }
@keyframes sweep { to { top: 100%; } }
.frame .brk { width: 30px; height: 30px; border-width: 3px; }
.an-title { font-size: 1.45rem; font-weight: 700; }
.spin { position: relative; width: 124px; height: 124px; margin: 30px auto; }
.spin svg.ring { position: absolute; inset: 0; animation: rot 1.3s linear infinite; }
.spin .bars { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 5px; }
.spin .bars i { width: 5px; border-radius: 3px; background: linear-gradient(180deg, #5ad1ff, #4f6bff); animation: eq 1s ease-in-out infinite; }
.spin .bars i:nth-child(1) { height: 16px; animation-delay: -.2s; } .spin .bars i:nth-child(2) { height: 30px; animation-delay: -.4s; }
.spin .bars i:nth-child(3) { height: 40px; } .spin .bars i:nth-child(4) { height: 26px; animation-delay: -.6s; } .spin .bars i:nth-child(5) { height: 14px; animation-delay: -.3s; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes eq { 50% { transform: scaleY(.45); } }

/* ---------- Result ---------- */
.res-hero { text-align: center; padding: 8px 0 22px; position: relative; isolation: isolate; }
.res-hero::before { content: ""; position: absolute; left: 50%; top: -60px; width: 420px; height: 300px; transform: translateX(-50%); z-index: -1; background: radial-gradient(closest-side, var(--glow, transparent), transparent); opacity: .4; pointer-events: none; }
.res-hero .shield { width: 150px; height: 150px; margin: 0 auto 6px; }
.res-title { font-size: 1.75rem; font-weight: 800; line-height: 1.25; }
.res-title .hl-bad { color: var(--bad); } .res-title .hl-warn { color: var(--warn); } .res-title .hl-good { color: var(--good); } .res-title .hl-muted { color: var(--text-2); }
.res-sub { margin: 10px auto 0; max-width: 300px; color: var(--text-2); font-size: .98rem; line-height: 1.55; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: .84rem; font-weight: 700; margin-top: 14px; }
.know { width: 100%; text-align: left; display: flex; gap: 14px; align-items: flex-start; padding: 16px; }
.know .ic.bulb { width: 28px; height: 28px; color: #fcd34d; }
.know .ic.chev { width: 20px; height: 20px; color: var(--text-3); align-self: center; transition: transform .2s; }
.know.open .ic.chev { transform: rotate(90deg); }
.know b { font-size: 1.02rem; }
.know p { margin-top: 4px; font-size: .88rem; color: var(--text-2); line-height: 1.55; }
.details { margin-top: 10px; }
.sig { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; font-size: .92rem; color: var(--text-2); border-top: 1px solid var(--line); }
.sig:first-of-type { border-top: 0; }
.sig .ic { width: 20px; height: 20px; color: var(--blue-2); margin-top: 2px; }
.res-actions { display: grid; gap: 10px; margin-top: 16px; }
.meter { height: 8px; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; margin: 8px 0 4px; }
.meter i { display: block; height: 100%; border-radius: 8px; }

/* ---------- History ---------- */
.filters { display: flex; gap: 8px; margin-bottom: 14px; }
.filters button { flex: 1; min-height: 40px; border-radius: 999px; background: rgba(20, 30, 80, .55); border: 1px solid var(--line); color: var(--text-2); font-weight: 600; font-size: .9rem; }
.filters button.on { background: var(--grad); border-color: transparent; color: #fff; }
.h-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin-bottom: 9px; text-align: left; }
.h-thumb { width: 56px; height: 44px; flex: none; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg, #24338a, #121a4a); display: grid; place-items: center; color: #c7d2fe; }
.h-thumb img { width: 100%; height: 100%; object-fit: cover; }
.h-thumb .ic { width: 22px; height: 22px; }
.h-main { flex: 1; min-width: 0; }
.h-name { font-weight: 600; font-size: .94rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.h-name .ic { width: 15px; height: 15px; color: var(--blue-2); }
.h-time { font-size: .8rem; color: var(--text-3); }
.badge { padding: 5px 11px; border-radius: 999px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.b-safe { background: rgba(47,211,138,.16); color: #5ee6a8; }
.b-sus { background: rgba(251,191,36,.16); color: #fcd34d; }
.b-fake { background: rgba(255,77,109,.18); color: #ff8da2; }
.b-unk { background: rgba(255,255,255,.08); color: var(--text-2); }
.empty { text-align: center; padding: 36px 10px; color: var(--text-2); }
.empty .ic { width: 48px; height: 48px; margin: 0 auto 12px; color: var(--text-3); }
.confirm { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 12px; }
.confirm span { flex: 1; font-size: .9rem; }
.confirm button { padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: .88rem; }

/* ---------- Tips ---------- */
.tips-hero { text-align: center; padding: 0 0 8px; }
.tips-hero svg { width: 120px; height: 120px; margin: 0 auto; }
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 40px; margin: 0 -20px; padding: 4px 20px; scrollbar-width: none; }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: center; }
.slide h3 { margin-bottom: 10px; color: var(--text-2); font-size: .92rem; font-weight: 600; }
.acc { border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin-bottom: 9px; overflow: hidden; }
.acc-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; text-align: left; font-size: .94rem; font-weight: 500; }
.acc-head .t { flex: 1; }
.acc-head .tile { width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-items: center; background: rgba(59,130,246,.16); color: var(--blue-2); font-size: 1.2rem; }
.acc-head .tile .ic { width: 22px; height: 22px; }
.acc-head .chev { width: 18px; height: 18px; color: var(--text-3); transition: transform .2s; }
.acc.open .acc-head .chev { transform: rotate(90deg); }
.acc-body { display: none; padding: 0 14px 14px 64px; font-size: .88rem; color: var(--text-2); line-height: 1.6; }
.acc.open .acc-body { display: block; }
.acc-warn { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.25); color: #fde68a; font-size: .86rem; }
.dots { display: flex; justify-content: center; gap: 8px; margin: 16px 0 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.2); transition: all .2s; }
.dots i.on { background: var(--blue-2); width: 22px; border-radius: 6px; }

/* ---------- Settings ---------- */
.user-card { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: left; }
.user-av { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(140deg, #4cb4ff, #4f6bff); display: grid; place-items: center; color: #fff; }
.user-av .ic { width: 28px; height: 28px; }
.user-card .nm { font-weight: 700; font-size: 1.06rem; }
.list { padding: 4px 0; margin-top: 14px; }
.row { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: left; font-size: .96rem; }

.row .chev { width: 18px; height: 18px; color: var(--text-3); }
.row-body { padding: 0 16px 16px 52px; }
.hotline { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.hotline a { font-weight: 800; font-size: 1.25rem; color: var(--blue-2); text-decoration: none; min-width: 64px; }
.hotline span { font-size: .86rem; color: var(--text-2); }
.version { text-align: center; color: var(--text-3); font-size: .8rem; margin-top: 18px; }

/* ---------- Quiz ---------- */
.q-choice { width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px; background: rgba(5,9,30,.5); border: 1px solid var(--line); margin-bottom: 9px; font-size: .95rem; line-height: 1.5; }
.q-choice.correct { border-color: rgba(47,211,138,.6); background: rgba(47,211,138,.12); }
.q-choice.wrong { border-color: rgba(255,77,109,.6); background: rgba(255,77,109,.1); }
.q-explain { padding: 12px 14px; border-radius: 12px; font-size: .9rem; margin: 6px 0 12px; line-height: 1.6; }
.q-explain.ok { background: rgba(47,211,138,.1); color: #a7f3d0; } .q-explain.no { background: rgba(255,77,109,.1); color: #fecdd3; }
.q-prog { height: 6px; border-radius: 6px; background: rgba(255,255,255,.08); margin: 10px 0 16px; overflow: hidden; }
.q-prog i { display: block; height: 100%; background: var(--grad); }

/* ---------- Chat ---------- */
#chatMessages { display: flex; flex-direction: column; gap: 10px; padding-bottom: 90px; }
.msg { max-width: 86%; padding: 12px 15px; border-radius: 18px; font-size: .95rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.bot { align-self: flex-start; background: var(--card-2); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.user { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 6px; }
.chatrow { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 520px; display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(7,11,31,0), var(--bg) 35%); z-index: 15; }
.chatrow input { border-radius: 999px; padding-left: 20px; }
.chatrow .btn { width: 54px; min-height: 54px; padding: 0; border-radius: 50%; flex: none; }

.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(90,169,255,.2); border-top-color: var(--blue-2); animation: rot .8s linear infinite; margin: 0 auto; }
.center { text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1d2a6b; border: 1px solid var(--line-2); padding: 11px 18px; border-radius: 999px; font-size: .9rem; white-space: nowrap; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: pageIn .2s ease; }
.info-body p { color: var(--text-2); font-size: .95rem; line-height: 1.75; margin-bottom: 12px; }
.info-body h3 { margin: 16px 0 6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

<script>
"use strict";
/* =====================================================================
   Deepfake Detective v2 — ทั้งแอปอยู่ในไฟล์เดียว (vanilla JS)

   กันบั๊ก input หลุด focus (ห้ามให้กลับมา):
   - สร้าง DOM ของแต่ละหน้า "ครั้งเดียว" ผ่าน ensureBuilt() แล้วสลับด้วยซ่อน/แสดง
   - ห้ามเขียน innerHTML ทับ container ที่มี input/textarea
   - อัปเดตเฉพาะ container ผลลัพธ์ที่ไม่มี input
   - ผูก event ด้วย addEventListener ครั้งเดียวตอนสร้างหน้า ไม่ใช้ inline onclick
===================================================================== */

/* ---------- ที่อยู่ Server ---------- */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ข้าม */ } }

function apiBase() {
  const saved = lsGet("apiBase");
  if (saved) return saved.replace(/\/+$/, "");
  if (location.protocol.startsWith("http")) return location.origin;
  return "http://localhost:8000";
}
async function api(path, options) {
  const res = await fetch(apiBase() + path, { headers: { "Content-Type": "application/json" }, ...options });
  let data = null;
  try { data = await res.json(); } catch (e) { /* ไม่ใช่ JSON */ }
  if (!res.ok) {
    const err = new Error((data && data.error_th) || "เชื่อมต่อ Server ไม่ได้ ลองใหม่อีกครั้ง");
    err.data = data; throw err;
  }
  return data;
}
function post(path, body, signal) { return api(path, { method: "POST", body: JSON.stringify(body || {}), signal }); }

/* ---------- ไอคอนเส้น ---------- */
const ICON = {
  home: '<path d="M3.5 11 12 3.8l8.5 7.2"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9.5"/>',

  camera: '<path d="M4 7.5h3l1.6-2.4h6.8L17 7.5h3a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5z"/><circle cx="12" cy="13.2" r="3.6"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7.5 8 5.5 8-5.5"/>',
  chat: '<path d="M20.5 11.6a8 8 0 0 1-11.7 7.1L3.5 20l1.3-4.6A8 8 0 1 1 20.5 11.6z"/>',
  bulb: '<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/>',

  search: '<circle cx="11" cy="11" r="7"/><path d="m16.2 16.2 4.3 4.3"/>',

  bookmarkFill: '<path d="M6.5 3.5h11v17L12 16.5l-5.5 4z" fill="currentColor"/>',

  phone: '<path d="M6.5 3.5h3l1.6 4-2 1.5a11 11 0 0 0 5.9 5.9l1.5-2 4 1.6v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2z"/>',

  doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
  server: '<rect x="3.5" y="4" width="17" height="7" rx="2"/><rect x="3.5" y="13" width="17" height="7" rx="2"/><path d="M7.5 7.5h.1M7.5 16.5h.1"/>',

  video: '<rect x="2.5" y="5.5" width="13" height="13" rx="3"/><path d="m15.5 10.5 6-3.2v9.4l-6-3.2z"/>',
  link: '<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>',
  upload: '<path d="M12 15.5V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>',
  send: '<path d="M4 12 20 4l-4.5 16-3.6-6.4z"/><path d="m11.9 13.6 8.1-9.6"/>',
  eye: '<path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  lens: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 4.6 4.6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="m12 8 1.5 2.5L16 12l-2.5 1.5L12 16l-1.5-2.5L8 12l2.5-1.5z"/>',
  alert: '<path d="M12 3.5 22 20.5H2z"/><path d="M12 10v4.5"/><path d="M12 17.4v.1"/>',
};
function icon(name, cls) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.8"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true"); s.setAttribute("class", cls ? "ic " + cls : "ic");
  s.innerHTML = ICON[name] || "";
  return s;
}

/* ---------- ตัวช่วย DOM ---------- */
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k === "html") node.innerHTML = v; // เฉพาะเนื้อหา static ที่เราเขียนเอง
    else node.setAttribute(k, v);
  }
  for (const ch of children) {
    if (ch == null) continue;
    node.appendChild(typeof ch === "string" ? document.createTextNode(ch) : ch);
  }
  return node;
}
function logoImg(cls) { return el("img", { src: "logo.svg", alt: "Deepfake Detective", class: cls || "" }); }
function wordmark(cls) {
  return el("div", { class: "wordmark " + (cls || "") },
    el("span", { class: "a", text: "Deepfake" }), el("span", { class: "b", text: "Detective" }));
}
function errBox(text) { return el("div", { class: "errbox", text }); }
function spinnerBox(text) {
  return el("div", { class: "center", style: "padding:22px 0" }, el("div", { class: "spinner" }),
    el("p", { class: "dim", style: "margin-top:10px", text }));
}
let toastTimer = null;
function toast(text) {
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = el("div", { class: "toast", text }); document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2200);
}
// คัดลอกข้อความ — ถ้า clipboard API ใช้ไม่ได้ (เช่น เปิดผ่าน http บน LAN) ใช้ textarea ชั่วคราวแทน
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* ลองวิธีสำรอง */ }
  const ta = el("textarea", { readonly: "", style: "position:fixed;top:-200px;opacity:0" });
  ta.value = text; document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { /* ไม่รองรับ */ }
  ta.remove();
  return ok;
}
function topbar(title, opts) {
  opts = opts || {};
  const bar = el("div", { class: "topbar" });
  if (opts.back !== false) {
    const b = el("button", { class: "icon-btn", "aria-label": "ย้อนกลับ" }, icon(opts.closeIcon ? "close" : "back"));
    b.addEventListener("click", opts.onBack || goBack);
    bar.appendChild(b);
  }
  const h = el("h1", null, opts.icon ? icon(opts.icon) : null, el("span", { text: title }));
  if (opts.center) { h.style.justifyContent = "center"; }
  bar.appendChild(h);
  for (const r of (opts.right || [])) bar.appendChild(r);
  return bar;
}

/* ---------- สถานะผู้ใช้ ---------- */
const state = {
  token: lsGet("token"), username: lsGet("username"), guest: lsGet("guest") === "1",
};
function saveAuth(token, username) {
  state.token = token; state.username = username; state.guest = false;
  lsSet("token", token); lsSet("username", username); lsDel("guest");
}
function saveGuest() { state.token = null; state.username = null; state.guest = true; lsDel("token"); lsDel("username"); lsSet("guest", "1"); }
function clearAuth() { state.token = null; state.username = null; state.guest = false; lsDel("token"); lsDel("username"); lsDel("guest"); }
function isLoggedIn() { return !!state.token || state.guest; }

/* ---------- ประวัติการตรวจ (เก็บในเครื่องนี้เท่านั้น) ---------- */
const HISTORY_KEY = "dd_history_v2";
const HISTORY_MAX = 40;
function loadHistory() { try { return JSON.parse(lsGet(HISTORY_KEY) || "[]"); } catch (e) { return []; } }
function saveHistory(list) {
  // ถ้าพื้นที่เต็ม ตัดรายการเก่าที่ไม่ได้บันทึกไว้ออกก่อน
  let l = list.slice(0, HISTORY_MAX);
  while (l.length && !lsSet(HISTORY_KEY, JSON.stringify(l))) {
    const idx = l.map((x) => x.saved).lastIndexOf(false);
    if (idx < 0) { l.pop(); } else { l.splice(idx, 1); }
  }
}
function addHistory(entry) {
  const list = loadHistory();
  list.unshift(entry);
  // เกินจำนวน → ลบรายการเก่าสุดที่ไม่ได้กดบันทึก
  while (list.length > HISTORY_MAX) {
    const idx = list.map((x) => x.saved).lastIndexOf(false);
    list.splice(idx < 0 ? list.length - 1 : idx, 1);
  }
  saveHistory(list);
}
function updateHistory(id, patch) {
  const list = loadHistory();
  const it = list.find((x) => x.id === id);
  if (it) { Object.assign(it, patch); saveHistory(list); }
}

/* ---------- ระดับความเสี่ยง ---------- */
function levelOf(entry) {
  if (entry.kind !== "text" && entry.data && entry.data.status && entry.data.status !== "ok") return "unk";
  const p = entry.risk || 0;
  return p >= 60 ? "fake" : p >= 30 ? "sus" : "safe";
}
function badgeFor(entry) {
  const lv = levelOf(entry);
  const text = { safe: "ปลอดภัย", sus: "น่าสงสัย", fake: entry.kind === "text" ? "น่าจะหลอก" : "น่าจะปลอม", unk: "ตรวจไม่ได้" }[lv];
  return el("span", { class: "badge b-" + lv, text });
}
function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  if (diff === 0) return "วันนี้, " + hm;
  if (diff === 1) return "เมื่อวาน, " + hm;
  return d.toLocaleDateString("th-TH", { day: "numeric", month: "short" }) + ", " + hm;
}

/* =====================================================================
   ระบบหน้า: สร้างครั้งเดียว สลับด้วยซ่อน/แสดง
===================================================================== */
const appRoot = document.getElementById("app");
const navRoot = document.getElementById("nav");
const navBar = navRoot.querySelector(".bar");
const pages = {};
const stack = [];
let currentPage = null;
const TAB_PAGES = ["home", "history", "profile"];

function registerPage(name, build, onShow, opts) {
  const root = el("section", { class: "page" + (opts && opts.full ? " full" : ""), id: "page-" + name });
  appRoot.appendChild(root);
  pages[name] = { root, built: false, build, onShow };
}
function ensureBuilt(name) {
  const p = pages[name];
  if (!p.built) { p.build(p.root); p.built = true; }
}
function showPage(name, opts) {
  opts = opts || {};
  ensureBuilt(name);
  if (TAB_PAGES.includes(name)) stack.length = 0;
  else if (!opts.replace && currentPage && currentPage !== name && !["splash", "analyzing"].includes(currentPage)) stack.push(currentPage);
  for (const [n, p] of Object.entries(pages)) p.root.classList.toggle("active", n === name);
  currentPage = name;
  navRoot.style.display = TAB_PAGES.includes(name) ? "block" : "none";
  for (const btn of navBar.querySelectorAll("button")) {
    const on = btn.dataset.page === name;
    btn.classList.toggle("on", on);
    btn.querySelector("svg").replaceWith(icon(on ? btn.dataset.icOn : btn.dataset.ic));
  }
  const p = pages[name];
  if (p.onShow) p.onShow(opts);
  window.scrollTo(0, 0);
}
function goBack() {
  const prev = stack.pop();
  showPage(prev || "home", { replace: true });
}

/* ---------- แถบล่าง 3 ปุ่ม ---------- */
const NAV_ITEMS = [
  { page: "home", ic: "home", icOn: "homeFill", label: "หน้าหลัก" },
  { page: "history", ic: "clock", icOn: "clock", label: "ประวัติ" },
  { page: "profile", ic: "user", icOn: "userFill", label: "โปรไฟล์" },
];
for (const item of NAV_ITEMS) {
  const b = el("button", { "data-page": item.page, "data-ic": item.ic, "data-ic-on": item.icOn, "aria-label": item.label },
    icon(item.ic), el("span", { text: item.label }));
  b.addEventListener("click", () => showPage(item.page));
  navBar.appendChild(b);
}

/* =====================================================================
   Splash
===================================================================== */
registerPage("splash", (root) => {
  const mark = el("div", { class: "splash-mark" },

/* ---------- ตัดเฟรมเป็นรูปย่อเก็บในประวัติ ---------- */
function makeThumb(objUrl) {
  return new Promise((resolve) => {
    if (!objUrl) return resolve(null);
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = objUrl;
    const done = (x) => { clearTimeout(t); resolve(x); };
    const t = setTimeout(() => done(null), 4000);
    v.addEventListener("loadeddata", () => { try { v.currentTime = Math.min(0.6, (v.duration || 1) / 3); } catch (e) { done(null); } }, { once: true });
    v.addEventListener("seeked", () => {
      try {
        const c = document.createElement("canvas"); c.width = 112; c.height = 88;
        const ctx = c.getContext("2d");
        const r = Math.max(c.width / v.videoWidth, c.height / v.videoHeight);
        const w = v.videoWidth * r, h = v.videoHeight * r;
        ctx.drawImage(v, (c.width - w) / 2, (c.height - h) / 2, w, h);
        done(c.toDataURL("image/jpeg", 0.7));
      } catch (e) { done(null); }
    }, { once: true });
    v.addEventListener("error", () => done(null), { once: true });
  });
}

async function runScan(job) {
  ensureBuilt("analyzing");
  an.media.textContent = "";
  if (job.kind === "video" && job.previewUrl) {
    const v = el("video", { muted: "", autoplay: "", loop: "", playsinline: "" });
    v.muted = true; v.src = job.previewUrl; an.media.appendChild(v);
    v.play().catch(() => { /* บางเครื่องไม่ให้เล่นอัตโนมัติ */ });
  } else if (job.kind === "link") {
    an.media.appendChild(el("div", { class: "center" }, icon("link", "big-ic"), el("p", { class: "dim", style: "margin-top:8px", text: job.name })));
    an.media.querySelector("svg").style.cssText = "width:44px;height:44px;margin:0 auto;color:#8fb3ff";
  } else {
    an.media.appendChild(el("div", { class: "txtprev", text: job.text }));
  }
  an.sub.textContent = job.kind === "text" ? "ใช้เวลาไม่กี่วินาที" : "ตรวจทีละช่วงของคลิป อาจใช้เวลา 1–3 นาที";
  showPage("analyzing");

  anCtrl = new AbortController();
  const signal = anCtrl.signal;
  try {
    let data;
    if (job.kind === "text") data = await post("/api/analyze-text", { text: job.text }, signal);
    else if (job.kind === "link") data = await post("/api/analyze-video", { url: job.url }, signal);
    else {
      const form = new FormData(); form.append("file", job.file);
      const res = await fetch(apiBase() + "/api/analyze-video-file", { method: "POST", body: form, signal });
      let d = null; try { d = await res.json(); } catch (e) { /* ไม่ใช่ JSON */ }
      if (!res.ok) throw new Error((d && d.error_th) || "ส่งไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง");
      data = d;
    }
    if (signal.aborted) return;
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      kind: job.kind, name: job.name, ts: Date.now(),
      risk: Math.round(data.risk_percent || 0), data, saved: false,
      thumb: job.kind === "video" ? await makeThumb(job.previewUrl) : null,
    };
    addHistory(entry);
    anCtrl = null;
    showResult(entry, { replace: true });
  } catch (e) {
    if (signal.aborted) return;
    anCtrl = null;
    showPage("scan", { replace: true });
    scanError(job.kind, e.message);
  }
}
function scanError(kind, text) {
  const slot = pages.scan.msg && pages.scan.msg[kind === "text" ? "text" : "video"];
  if (slot) { slot.textContent = ""; slot.appendChild(errBox(text)); }
  else toast(text);
}

function resultShield(lv) {

  function setFilter(f) {
    filter = f;
    fAll.classList.toggle("on", f === "all"); fSafe.classList.toggle("on", f === "safe"); fSus.classList.toggle("on", f === "sus");
    renderList();
  }
  fAll.addEventListener("click", () => setFilter("all"));
  fSafe.addEventListener("click", () => setFilter("safe"));
  fSus.addEventListener("click", () => setFilter("sus"));

  function renderList() {
    listBox.textContent = "";
    const q = inSearch.value.trim().toLowerCase();
    const items = loadHistory().filter((it) => {
      const lv = levelOf(it);
      if (filter === "safe" && lv !== "safe") return false;
      if (filter === "sus" && !(lv === "sus" || lv === "fake")) return false;
      return !q || (it.name || "").toLowerCase().includes(q);
    });
    if (!items.length) {
      listBox.appendChild(el("div", { class: "empty" }, icon("clock"),
        el("h3", { text: q || filter !== "all" ? "ไม่พบรายการที่ตรงกัน" : "ยังไม่มีประวัติการตรวจ" }),
        el("p", { class: "dim", style: "margin-top:6px", text: "ผลการตรวจทุกครั้งจะแสดงที่นี่" })));
      if (!q && filter === "all") {
        const go = el("button", { class: "btn", style: "margin-top:6px" }, icon("camera"), el("span", { text: "เริ่มสแกนคลิป" }));
        go.addEventListener("click", () => openScan("video"));
        listBox.appendChild(go);
      }
      return;
    }
    for (const it of items) {
      const thumb = el("span", { class: "h-thumb" });
      if (it.thumb) thumb.appendChild(el("img", { src: it.thumb, alt: "" }));
      else thumb.appendChild(icon(it.kind === "text" ? "mail" : it.kind === "link" ? "link" : "video"));
      const nameRow = el("span", { class: "h-name" }, it.saved ? icon("bookmarkFill") : null, el("span", { text: it.name || "ไม่มีชื่อ" }));
      const row = el("button", { class: "h-item" }, thumb,
        el("span", { class: "h-main" }, nameRow, el("span", { class: "h-time", text: fmtTime(it.ts) })),
        badgeFor(it));
      row.addEventListener("click", () => showResult(it));
      listBox.appendChild(row);
    }
  }
  pages.history.render = renderList;
}, () => { pages.history.render(); });

registerPage("quiz", (root) => {
  root.appendChild(topbar("Quiz รู้ทันกลโกง"));
  root.appendChild(el("p", { class: "muted", style: "margin-bottom:16px", text: "7 สถานการณ์จริงที่คนไทยเจอบ่อย คุณจะรับมือยังไง?" }));
  const quizArea = el("div");
  root.appendChild(quizArea);
  let qi = 0, score = 0, answered = false;
  function renderQ() {
    quizArea.textContent = ""; answered = false;
    const item = QUIZ[qi];
    const card = el("div", { class: "card" });
    card.appendChild(el("p", { class: "dim", text: `ข้อ ${qi + 1} / ${QUIZ.length} · ถูก ${score} ข้อ` }));
    card.appendChild(el("div", { class: "q-prog" }, el("i", { style: `width:${Math.round((qi / QUIZ.length) * 100)}%` })));
    card.appendChild(el("h3", { style: "margin-bottom:14px", text: item.q }));
    const explainSlot = el("div"), nextSlot = el("div"), btns = [];
    item.choices.forEach((c, i) => {
      const b = el("button", { class: "q-choice", text: c });
      b.addEventListener("click", () => {
        if (answered) return; answered = true;
        const ok = i === item.answer; if (ok) score++;
        b.classList.add(ok ? "correct" : "wrong"); btns[item.answer].classList.add("correct");
        btns.forEach((x) => { x.disabled = true; });
        explainSlot.appendChild(el("div", { class: "q-explain " + (ok ? "ok" : "no"), text: (ok ? "ถูกต้อง! " : "ยังไม่ใช่ — ") + item.explain }));
        const nb = el("button", { class: "btn" }, el("span", { text: qi + 1 < QUIZ.length ? "ข้อต่อไป" : "ดูคะแนน" }), icon("right"));
        nb.addEventListener("click", () => { qi++; if (qi < QUIZ.length) renderQ(); else renderSum(); });
        nextSlot.appendChild(nb);
      });
      btns.push(b); card.appendChild(b);
    });
    card.appendChild(explainSlot); card.appendChild(nextSlot);
    quizArea.appendChild(card);
  }
  function renderSum() {
    quizArea.textContent = "";
    const pct = score / QUIZ.length;
    const verdict = pct === 1 ? "เต็ม! รู้ทันมิจฉาชีพสุด ๆ" : pct >= 0.7 ? "เก่งมาก เกือบเต็มแล้ว" : pct >= 0.5 ? "ดีแล้ว ทบทวน Tips อีกนิดจะปลอดภัยขึ้น" : "ไม่เป็นไร ลองอ่าน Tips แล้วทำใหม่อีกรอบ";
    const card = el("div", { class: "card center" });
    card.appendChild(el("div", { class: "rule-num", style: "margin:4px auto 14px;width:64px;height:64px;border-radius:20px;font-size:1.3rem", text: `${score}/${QUIZ.length}` }));
    card.appendChild(el("h3", { text: verdict }));
    const retry = el("button", { class: "btn", style: "margin-top:18px" }, icon("refresh"), el("span", { text: "ทำใหม่อีกครั้ง" }));
    retry.addEventListener("click", () => { qi = 0; score = 0; renderQ(); });
    card.appendChild(retry);
    quizArea.appendChild(card);
  }
  renderQ();
}, null, { full: true });

registerPage("chat", (root) => {
  root.appendChild(topbar("AI ผู้ช่วย"));
  const messages = el("div", { id: "chatMessages" });
  root.appendChild(messages);
  const inMsg = el("input", { type: "text", placeholder: "พิมพ์คำถามตรงนี้", "aria-label": "พิมพ์คำถาม" });
  const sendBtn = el("button", { class: "btn", "aria-label": "ส่ง" }, icon("send"));
  const row = el("div", { class: "chatrow hidden" }, inMsg, sendBtn);
  root.appendChild(row);
  const hist = [];
  function addMsg(role, text) {
    const m = el("div", { class: "msg " + (role === "user" ? "user" : "bot"), text });
    messages.appendChild(m);
    window.scrollTo(0, document.body.scrollHeight);
    return m;
  }
  addMsg("bot", "สวัสดี! มีอะไรให้ช่วยไหม\nลองถามเช่น “มีคนโทรมาอ้างเป็นตำรวจ ทำยังไงดี” หรือ “คลิปดาราชวนลงทุน เชื่อได้ไหม”");
  let sending = false;
  async function send() {
    const text = inMsg.value.trim();
    if (!text || sending) return;
    sending = true; inMsg.value = "";
    addMsg("user", text);
    const waiting = addMsg("bot", "กำลังพิมพ์...");
    try {
      const d = await post("/api/chat", { message: text, history: hist.slice(-6) });
      waiting.textContent = d.reply_th.replace(/\*\*(.+?)\*\*/g, "$1"); // ตัดตัวหนาแบบ Markdown ที่ AI อาจใส่มา
      hist.push({ role: "user", text }); hist.push({ role: "bot", text: d.reply_th });
    } catch (e) { waiting.textContent = "ขอโทษ ตอนนี้ตอบไม่ได้ (" + e.message + ") ลองใหม่อีกครั้ง"; }
    finally { sending = false; window.scrollTo(0, document.body.scrollHeight); }
  }
  sendBtn.addEventListener("click", send);
  inMsg.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  pages.chat.row = row;
}, () => { pages.chat.row.classList.remove("hidden"); }, { full: true });
// ซ่อนแถวพิมพ์ของแชทเมื่อออกจากหน้า (แถวเป็น position:fixed)
const _showPage = showPage;
showPage = function (name, opts) {
  if (pages.chat && pages.chat.row && name !== "chat") pages.chat.row.classList.add("hidden");
  _showPage(name, opts);
};

    authBtn.textContent = "";
    authBtn.appendChild(icon(guest ? "user" : "logout"));
    authBtn.appendChild(el("span", { text: guest ? "เข้าสู่ระบบ / สมัครสมาชิก" : "ออกจากระบบ" }));
    authBtn.className = guest ? "btn" : "btn danger";
    authBtn.style.marginTop = "16px";
  };
}, () => { pages.profile.refresh(); });

/* =====================================================================
   เริ่มแอป
===================================================================== */
(async function start() {
  showPage("splash");
  const minSplash = new Promise((r) => setTimeout(r, 1500));
  if (state.token) {
    try {
      const d = await post("/api/me", { token: state.token });
      state.username = d.username; lsSet("username", d.username);
    } catch (e) { if (e.data && e.data.ok === false) clearAuth(); }
  }
  await minSplash;
  showPage(isLoggedIn() ? "home" : "login", { replace: true });
})();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* ไม่รองรับก็ใช้ต่อได้ */ });
}
</script>
