<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a13">
<title>Deepfake Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* =====================================================================
   Deepfake Detective — โลกภาพ: คืนที่มีไฟฉายนักสืบส่องอยู่
   พื้นน้ำเงินดำลึก + ลำแสงฟ้า #0ea5e9 → #38bdf8 + เส้นบางโปร่ง
   ตัวอักษรใหญ่ ปุ่มใหญ่ กดง่ายสำหรับผู้สูงอายุ
===================================================================== */
:root {
  --bg: #060a13;
  --bg-2: #0a1120;
  --surface: rgba(148, 184, 235, .045);
  --surface-2: rgba(148, 184, 235, .085);
  --line: rgba(148, 184, 235, .12);
  --line-2: rgba(148, 184, 235, .22);
  --brand: #0ea5e9;
  --brand-2: #38bdf8;
  --brand-3: #7dd3fc;
  --brand-deep: #0369a1;
  --text: #f3f8fe;
  --text-2: #a9bcd4;
  --text-3: #7d90a8;
  --good: #34d399;
  --warn: #fbbf24;
  --bad: #fb7185;
  --r-sm: 12px;
  --r: 16px;
  --r-lg: 22px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body {
  font-family: "Anuphan", "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
/* ลำแสงไฟฉายจากด้านบน — นิ่ง ไม่รบกวนการอ่าน */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(48rem 30rem at 50% -8rem, rgba(14, 165, 233, .16), transparent 62%),
    radial-gradient(30rem 24rem at 92% 6%, rgba(56, 189, 248, .07), transparent 60%);
}
#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 20px 18px 108px; }

h1 { font-size: 1.55rem; font-weight: 600; letter-spacing: -.015em; line-height: 1.4; }
h2 {
  font-size: 1.16rem; font-weight: 600; letter-spacing: -.01em;
  margin: 30px 0 14px; display: flex; align-items: center; gap: 11px;
}
h2::before {
  content: ""; width: 3px; height: 1.05em; border-radius: 99px; flex: none;
  background: linear-gradient(180deg, var(--brand-2), var(--brand));
}
h3 { font-size: 1.04rem; font-weight: 600; line-height: 1.55; }
p { line-height: 1.8; }
.muted { color: var(--text-2); font-size: .95rem; line-height: 1.8; }
.dim { color: var(--text-3); font-size: .88rem; }
.lead { color: var(--text-2); font-size: 1rem; margin-top: 4px; }

.page { display: none; }
.page.active { display: block; animation: rise .34s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 20px; margin-bottom: 14px;
}
.card > h3 + p { margin-top: 7px; }

/* ---------- ปุ่ม ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; min-height: 56px; padding: 15px 18px;
  background: linear-gradient(140deg, var(--brand-2), var(--brand));
  color: #041420; border: none; border-radius: var(--r);
  font-size: 1.08rem; font-weight: 600; font-family: inherit; cursor: pointer;
  box-shadow: 0 12px 26px -14px rgba(14, 165, 233, .85);
  transition: transform .12s var(--ease), box-shadow .2s, opacity .2s;
}
.btn:hover { box-shadow: 0 16px 32px -14px rgba(14, 165, 233, .95); }
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
.btn:focus-visible, .tabs button:focus-visible, #nav button:focus-visible,
.shortcut:focus-visible, .acc-head:focus-visible, .quiz-choice:focus-visible {
  outline: 2px solid var(--brand-2); outline-offset: 3px;
}
.btn.secondary {
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line-2); box-shadow: none;
}
.btn.secondary:hover { border-color: var(--brand); }
.btn.danger {
  background: transparent; color: #fca5a5;
  border: 1px solid rgba(251, 113, 133, .32); box-shadow: none;
}
.btn.danger:hover { background: rgba(251, 113, 133, .09); }
.btn + .btn { margin-top: 10px; }
.btn .ic { width: 20px; height: 20px; flex: none; }

/* ---------- ช่องกรอก ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; margin-bottom: 8px; font-weight: 500; font-size: .95rem; color: var(--text-2); }
input[type=text], input[type=password], input[type=url], textarea {
  width: 100%; min-height: 54px;
  background: rgba(6, 10, 19, .55); color: var(--text);
  border: 1.5px solid var(--line-2); border-radius: var(--r);
  padding: 14px 16px; font-size: 1.05rem; font-family: inherit; line-height: 1.7;
  transition: border-color .18s, box-shadow .18s;
}
input::placeholder, textarea::placeholder { color: var(--text-3); }
input:focus, textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 4px rgba(14, 165, 233, .14);
}
textarea { min-height: 132px; resize: vertical; }

/* ---------- แท็บ ---------- */
.tabs {
  display: flex; gap: 4px; margin-bottom: 18px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 99px;
}
.tabs button {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 12px 8px; border: none; border-radius: 99px; background: transparent;
  color: var(--text-2); font-size: .99rem; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: background .2s, color .2s;
}
.tabs button .ic { width: 18px; height: 18px; }
.tabs button.on { background: linear-gradient(140deg, var(--brand-2), var(--brand)); color: #041420; }

/* ---------- แถบล่าง ---------- */
#nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: none; justify-content: center; gap: 2px;
  background: rgba(6, 10, 19, .88);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
}
#nav button {
  flex: 1; max-width: 96px; background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 7px 4px; border-radius: 14px;
  color: var(--text-3); font-family: inherit; font-size: .75rem; font-weight: 500;
  transition: color .2s, background .2s;
}
#nav button .ic { width: 23px; height: 23px; }
#nav button.on { color: var(--brand-3); background: rgba(14, 165, 233, .14); }

/* ---------- ปกแอป ---------- */
#page-cover.active { display: flex; flex-direction: column; min-height: calc(100vh - 128px); animation: none; }
.cover-top { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 22px 0 8px; }
.cover-mark { width: 108px; height: 108px; filter: drop-shadow(0 14px 34px rgba(14, 165, 233, .42)); }
.cover-mark .draw { stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 1.15s var(--ease) .12s forwards; }
.cover-mark .draw2 { animation-delay: .34s; }
.cover-mark .draw3 { animation-delay: .52s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.brand { margin-top: 20px; font-size: 1.72rem; font-weight: 300; letter-spacing: .01em; line-height: 1.25; }
.brand b { font-weight: 700; color: var(--brand-3); }
.cover-tag { margin-top: 10px; font-size: 1.12rem; color: var(--text); font-weight: 500; line-height: 1.6; }
.cover-sub { margin-top: 7px; color: var(--text-2); font-size: .97rem; }
.cover-list { width: 100%; margin: 30px 0 6px; display: flex; flex-direction: column; gap: 2px; }
.cover-item { display: flex; align-items: center; gap: 14px; padding: 13px 4px; text-align: left; }
.cover-item + .cover-item { border-top: 1px solid var(--line); }
.cover-item .ic-wrap {
  width: 44px; height: 44px; flex: none; border-radius: 14px;
  display: grid; place-items: center;
  background: rgba(14, 165, 233, .12); border: 1px solid rgba(14, 165, 233, .2); color: var(--brand-3);
}
.cover-item .ic { width: 22px; height: 22px; }
.cover-item b { display: block; font-weight: 600; font-size: 1.01rem; }
.cover-item span { color: var(--text-2); font-size: .9rem; line-height: 1.55; }
.cover-foot { padding-top: 12px; }
.cover-note { text-align: center; margin-top: 12px; color: var(--text-3); font-size: .87rem; }
.fade-up { animation: rise .6s var(--ease) both; }
.d1 { animation-delay: .5s; } .d2 { animation-delay: .62s; }
.d3 { animation-delay: .74s; } .d4 { animation-delay: .86s; }

/* ---------- หน้าเข้าสู่ระบบ ---------- */
.auth-head { text-align: center; padding: 26px 0 22px; }
.auth-head .mark { width: 62px; height: 62px; filter: drop-shadow(0 10px 24px rgba(14, 165, 233, .35)); }
.auth-head .brand { font-size: 1.3rem; margin-top: 12px; }
.hr-text { display: flex; align-items: center; gap: 14px; color: var(--text-3); margin: 20px 0; font-size: .88rem; }
.hr-text::before, .hr-text::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- ทางลัดหน้าหลัก ---------- */
.shortcut {
  display: flex; align-items: center; gap: 15px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 17px 18px; margin-bottom: 11px; cursor: pointer;
  font-family: inherit; color: var(--text); font-size: 1rem;
  transition: border-color .2s, background .2s, transform .12s var(--ease);
}
.shortcut:hover { border-color: var(--line-2); background: var(--surface-2); }
.shortcut:active { transform: scale(.99); }
.shortcut .ic-wrap {
  width: 50px; height: 50px; flex: none; border-radius: var(--r-sm);
  display: grid; place-items: center;
  background: rgba(14, 165, 233, .12); border: 1px solid rgba(14, 165, 233, .2); color: var(--brand-3);
}
.shortcut .ic { width: 24px; height: 24px; }
.shortcut b { display: block; font-size: 1.06rem; font-weight: 600; margin-bottom: 1px; }
.shortcut .go { margin-left: auto; color: var(--text-3); width: 20px; height: 20px; flex: none; }

/* ---------- กฎทอง ---------- */
.rule-card { display: flex; gap: 15px; align-items: flex-start; }
.rule-num {
  width: 40px; height: 40px; border-radius: 13px; flex: none; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--brand-2), var(--brand));
  color: #041420; font-weight: 700; font-size: 1.08rem;
  box-shadow: 0 8px 18px -10px rgba(14, 165, 233, .9);
}

/* ---------- ผลตรวจ ---------- */
.ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 13px; padding: 4px 0 2px; }
.ring-wrap svg { display: block; }
.ring-wrap svg .prog { animation: sweep .9s var(--ease) both; }
@keyframes sweep { from { stroke-dasharray: 0 400; } }
.badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 99px; font-size: .92rem; font-weight: 600; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: currentColor; flex: none; }
.verdict { margin-top: 16px; font-size: 1.06rem; font-weight: 600; line-height: 1.65; }
.signal { display: flex; gap: 11px; margin: 10px 0; line-height: 1.7; font-size: .96rem; }
.signal .dot { flex: none; width: 18px; height: 18px; margin-top: 4px; color: var(--brand-3); }
.advice {
  margin-top: 16px; padding: 14px 16px; border-radius: var(--r);
  background: rgba(14, 165, 233, .08); border: 1px solid rgba(14, 165, 233, .2);
  line-height: 1.75; font-size: .97rem;
}
.disclaimer {
  margin-top: 16px; padding: 13px 16px; border-radius: var(--r);
  background: rgba(163, 230, 53, .06); border: 1px solid rgba(163, 230, 53, .2);
  color: #d3ecac; font-size: .9rem; line-height: 1.72;
}
.res-meta { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }

/* ---------- accordion ---------- */
.acc-item {
  border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px;
  overflow: hidden; background: var(--surface);
}
.acc-head {
  width: 100%; display: flex; align-items: center; gap: 13px; text-align: left;
  background: transparent; color: var(--text); border: none; padding: 15px 16px;
  font-size: 1rem; font-weight: 500; font-family: inherit; cursor: pointer; line-height: 1.55;
}
.acc-ic {
  width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center;
  font-size: 1.1rem; background: rgba(14, 165, 233, .1); border: 1px solid rgba(14, 165, 233, .18);
}
.acc-head .ar { margin-left: auto; color: var(--text-3); width: 18px; height: 18px; flex: none; transition: transform .25s var(--ease); }
.acc-item.open .ar { transform: rotate(90deg); }
.acc-body { display: none; padding: 0 16px 16px; }
.acc-item.open .acc-body { display: block; animation: rise .28s var(--ease) both; }
.acc-warn {
  margin-top: 13px; padding: 12px 14px; border-radius: var(--r-sm);
  background: rgba(251, 191, 36, .07); border: 1px solid rgba(251, 191, 36, .22);
  color: #fbd98a; font-size: .93rem; line-height: 1.7;
}

/* ---------- แชท ---------- */
#chatMessages { display: flex; flex-direction: column; gap: 11px; min-height: 200px; margin-bottom: 14px; }
.msg { max-width: 88%; padding: 13px 17px; border-radius: 20px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; font-size: .98rem; }
.msg.user { align-self: flex-end; background: linear-gradient(140deg, var(--brand), var(--brand-deep)); color: #eaf6ff; border-bottom-right-radius: 7px; }
.msg.bot { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 7px; }
.chatrow { display: flex; gap: 9px; align-items: center; }
.chatrow input { flex: 1; border-radius: 99px; min-height: 54px; }
.chatrow .btn { width: 54px; min-height: 54px; flex: none; padding: 0; border-radius: 99px; }

/* ---------- แบบทดสอบ ---------- */
.quiz-progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 12px 0 18px; }
.quiz-progress > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand-2), var(--brand)); transition: width .45s var(--ease); }
.quiz-choice {
  display: block; width: 100%; text-align: left;
  background: var(--surface-2); color: var(--text);
  border: 1.5px solid var(--line); border-radius: var(--r);
  padding: 15px 17px; margin-bottom: 10px;
  font-size: 1rem; font-family: inherit; cursor: pointer; line-height: 1.65;
  transition: border-color .2s, background .2s;
}
.quiz-choice:hover:not(:disabled) { border-color: var(--line-2); }
.quiz-choice.correct { border-color: var(--good); background: rgba(52, 211, 153, .1); }
.quiz-choice.wrong { border-color: var(--bad); background: rgba(251, 113, 133, .1); }
.quiz-choice:disabled { cursor: default; opacity: .92; }
.quiz-explain { border-radius: var(--r); padding: 14px 16px; margin: 8px 0 14px; line-height: 1.75; font-size: .95rem; }
.quiz-explain.ok { background: rgba(52, 211, 153, .08); border: 1px solid rgba(52, 211, 153, .25); color: #b5ecd6; }
.quiz-explain.no { background: rgba(251, 113, 133, .08); border: 1px solid rgba(251, 113, 133, .25); color: #fbc7c7; }

/* ---------- สถานะ ---------- */
.spinner {
  width: 30px; height: 30px; margin: 6px auto;
  border: 3px solid var(--surface-2); border-top-color: var(--brand-2);
  border-radius: 50%; animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.center { text-align: center; }
.errbox {
  background: rgba(251, 113, 133, .08); border: 1px solid rgba(251, 113, 133, .28);
  color: #fbc7c7; border-radius: var(--r); padding: 14px 16px; line-height: 1.75; font-size: .96rem;
}
.hidden { display: none !important; }

/* ---------- สายด่วน ---------- */
.hotline { display: flex; align-items: center; gap: 15px; padding: 14px 0; }
.hotline + .hotline { border-top: 1px solid var(--line); }
.hotline-num { font-size: 1.5rem; font-weight: 700; color: var(--brand-3); flex: none; letter-spacing: -.02em; }

@media (prefers-reduced-motion: reduce) {
  *, *::before { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .cover-mark .draw { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>

<script>
"use strict";
/* =====================================================================
   Deepfake Detective — ทั้งแอปในไฟล์เดียว (vanilla JS)

   กฎเหล็ก (กันบั๊ก input หลุด focus):
   - สร้าง DOM ของแต่ละหน้า "ครั้งเดียว" ผ่าน ensureBuilt() แล้วสลับด้วยซ่อน/แสดง
   - ห้ามเขียน innerHTML ทับ container ที่มี input/textarea ที่ผู้ใช้พิมพ์อยู่
   - อัปเดตเฉพาะ container ผลลัพธ์ (#videoResult #textResult #chatMessages #quizArea)
   - ผูก event ด้วย addEventListener ครั้งเดียวตอนสร้างหน้า ไม่ใช้ inline onclick
===================================================================== */

/* ---------- ที่อยู่เซิร์ฟเวอร์: ตรวจ origin เองอัตโนมัติ ---------- */
function apiBase() {
  const saved = localStorage.getItem("apiBase");
  if (saved) return saved.replace(/\/+$/, "");
  if (location.protocol.startsWith("http")) return location.origin;
  return "http://localhost:8000";
}
async function api(path, options) {
  const res = await fetch(apiBase() + path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* ไม่ใช่ JSON */ }
  if (!res.ok) {
    const msg = (data && data.error_th) || "ตอนนี้ติดต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้งนะคะ";
    const err = new Error(msg); err.data = data; throw err;
  }
  return data;
}
function post(path, body) { return api(path, { method: "POST", body: JSON.stringify(body || {}) }); }

/* ---------- ไอคอน (เส้น SVG — คมทุกขนาด ไม่พึ่งอีโมจิ) ---------- */
const ICON = {
  home: '<path d="M4 11.4 12 4l8 7.4V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v14H6.5A2.5 2.5 0 0 0 4 19.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  chat: '<path d="M20.5 11.8a7.7 7.7 0 0 1-11.2 6.9L4 20l1.3-4.4A7.7 7.7 0 1 1 20.5 11.8z"/>',
  user: '<circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.4 7.4 0 0 1 14.4 0"/>',
  video: '<rect x="2.5" y="5.5" width="13" height="13" rx="3"/><path d="m15.5 10.5 6-3.2v9.4l-6-3.2z"/>',
  mail: '<rect x="2.8" y="4.8" width="18.4" height="14.4" rx="3"/><path d="m4 8 8 5 8-5"/>',
  send: '<path d="M4 12 20 4l-4.5 16-3.6-6.4z"/><path d="m11.9 13.6 8.1-9.6"/>',
  file: '<path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M13.5 3v5.5H19"/>',
  right: '<path d="m9 5 7 7-7 7"/>',
  lens: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 4.6 4.6"/><path d="m8 10.5 2 2 4-4"/>',
  shield: '<path d="M12 3 20 6.3v6.2c0 4.7-3.4 8.5-8 9.5-4.6-1-8-4.8-8-9.5V6.3z"/>',
  phone: '<path d="M6.5 3.5h3l1.6 4-2 1.5a11 11 0 0 0 5.9 5.9l1.5-2 4 1.6v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2z"/>',
  eye: '<path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',

const state = {

  username: localStorage.getItem("username") || null,
  guest: localStorage.getItem("guest") === "1",
};
function saveAuth(token, username) {
  state.token = token; state.username = username; state.guest = false;
  localStorage.setItem("token", token);
  localStorage.setItem("username", username);
  localStorage.removeItem("guest");
}
function saveGuest() {
  state.token = null; state.username = null; state.guest = true;
  localStorage.removeItem("token"); localStorage.removeItem("username");
  localStorage.setItem("guest", "1");
}
function clearAuth() {
  state.token = null; state.username = null; state.guest = false;
  localStorage.removeItem("token"); localStorage.removeItem("username");
  localStorage.removeItem("guest");
}
function isLoggedIn() { return !!state.token || state.guest; }

/* ---------- ตัวช่วยสร้าง DOM ---------- */
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k === "html") node.innerHTML = v; // เนื้อหา static ที่เราสร้างเองเท่านั้น
    else node.setAttribute(k, v);
  }
  for (const ch of children) {
    if (ch == null) continue;
    node.appendChild(typeof ch === "string" ? document.createTextNode(ch) : ch);
  }
  return node;
}
function riskColor(p) { return p >= 60 ? "#fb7185" : p >= 30 ? "#fbbf24" : "#34d399"; }
function riskLabel(p) {
  if (p >= 60) return { text: "เสี่ยงสูง ระวังให้มาก", bg: "rgba(251,113,133,.14)", fg: "#fca5a5" };
  if (p >= 30) return { text: "น่าสงสัย ควรระวัง", bg: "rgba(251,191,36,.14)", fg: "#fbd98a" };
  return { text: "ยังไม่เจอสัญญาณอันตราย", bg: "rgba(52,211,153,.14)", fg: "#a7e8cd" };
}
function spinnerBox(text) {
  return el("div", { class: "center card" },
    el("div", { class: "spinner" }),
    el("p", { class: "muted", style: "margin-top:8px", text }));
}
function errBox(text) { return el("div", { class: "errbox", text }); }
function disclaimerBox(text) { return el("div", { class: "disclaimer", text: "โปรดอ่าน: " + text }); }

  const root = el("section", { class: "page", id: "page-" + name });

}
function ensureBuilt(name) {
  const p = pages[name];
  if (!p.built) { p.build(p.root); p.built = true; }
}
function showPage(name) {
  ensureBuilt(name);
  for (const [n, p] of Object.entries(pages)) p.root.classList.toggle("active", n === name);
  currentPage = name;
  navRoot.style.display = (name === "login" || name === "cover") ? "none" : "flex";

    btn.classList.toggle("on", btn.dataset.page === name);

  window.scrollTo(0, 0);
}

    }
    textBtn.disabled = true;
    textBtn.textContent = "กำลังอ่าน...";
    textResult.textContent = "";
    textResult.appendChild(spinnerBox("กำลังอ่านข้อความให้อยู่ค่ะ"));
    try {
      const d = await post("/api/analyze-text", { text });
      renderRisk(textResult, d.risk_percent, d.signals_th, d.verdict_th, d.advice_th, d.disclaimer_th);
    } catch (e) {
      textResult.textContent = "";
      textResult.appendChild(errBox(e.message));
    } finally {
      textBtn.disabled = false;
      textBtn.textContent = "ตรวจข้อความนี้";
    }
  });

  /* ----- แสดงผลคลิป (ใช้ร่วมกันทั้งลิงก์และไฟล์) ----- */
  function showVideoResult(d) {
    videoResult.textContent = "";
    if (d.status === "ok") {
      const extras = [];
      const meta = el("div", { class: "res-meta" });
      meta.appendChild(el("p", { class: "dim", text: `ดูภาพจากคลิป ${d.frames_analyzed} ช่วง พบใบหน้า ${d.faces_found} ช่วง` }));
      if (d.suspicious_timestamps && d.suspicious_timestamps.length) {
        const times = d.suspicious_timestamps.slice(0, 8).map((t) => {
          const m = Math.floor(t / 60), s = Math.round(t % 60);
          return `${m}:${String(s).padStart(2, "0")}`;
        }).join(", ");
        meta.appendChild(el("p", { class: "dim", style: "margin-top:5px", text: `ช่วงที่น่าสงสัย (นาที:วินาที) ${times}` }));
      }
      extras.push(meta);
      if (d.artifact_notes_th && d.artifact_notes_th.length) {
        extras.push(el("h3", { style: "margin-top:18px", text: "ร่องรอยในภาพที่พบ" }));
        for (const n of d.artifact_notes_th) {
          extras.push(el("div", { class: "signal" }, icon("eye", "dot"), el("span", { text: n })));
        }
      }
      extras.push(el("div", { class: "acc-warn", style: "margin-top:16px" },
        el("b", { text: "ลองเพ่งดูด้วยตาตัวเองอีกที: " }),
        "ขอบใบหน้าและไรผมมีรอยต่อไหม ตากะพริบธรรมชาติไหม ฟันกับหูผิดรูปไหม แสงบนหน้าเข้ากับฉากหลังไหม และปากขยับตรงกับเสียงไหม"));

      renderRisk(videoResult, d.risk_percent, null,
        d.risk_percent >= 60 ? "คลิปนี้มีสัญญาณของการตัดต่อค่อนข้างมาก" :
        d.risk_percent >= 30 ? "คลิปนี้มีบางจุดน่าสงสัย ควรตรวจเพิ่ม" :
        "ยังไม่เจอสัญญาณการตัดต่อที่ชัดเจน",
        d.risk_percent >= 30 ? "อย่าเพิ่งเชื่อหรือโอนเงินตามคลิปนี้ ให้โทรถามเจ้าตัวด้วยเบอร์จริงก่อน" :
        "ถึงคลิปจะดูปกติ ถ้ามีการขอเงินหรือขอรหัส ให้ยึดกฎทอง 3 ข้อไว้เสมอ",
        d.disclaimer_th, extras);
    } else {
      videoResult.appendChild(el("div", { class: "card" },
        el("h3", { text: d.status === "no_face" ? "ไม่พบใบหน้าในคลิปนี้" : "ตรวจคลิปนี้ไม่สำเร็จ" }),
        el("p", { class: "muted", style: "margin-top:9px", text: d.error_th || "เกิดข้อผิดพลาด ลองใหม่อีกครั้งนะคะ" }),
        disclaimerBox(d.disclaimer_th)));
    }
  }

  /* ----- ตรวจคลิปจากลิงก์ ----- */
  videoBtn.addEventListener("click", async () => {
    const url = inUrl.value.trim();
    if (!url) {
      videoResult.textContent = "";
      videoResult.appendChild(errBox("วางลิงก์คลิปก่อนนะคะ"));
      return;
    }
    videoBtn.disabled = true;
    videoBtn.textContent = "กำลังตรวจ...";
    videoResult.textContent = "";
    videoResult.appendChild(spinnerBox("กำลังดูคลิปให้อยู่ค่ะ ใช้เวลาสัก 1-3 นาที อย่าเพิ่งปิดหน้านี้นะคะ"));
    try {
      showVideoResult(await post("/api/analyze-video", { url }));
    } catch (e) {
      videoResult.textContent = "";
      videoResult.appendChild(errBox(e.message));
    } finally {
      videoBtn.disabled = false;
      videoBtn.textContent = "ตรวจลิงก์นี้";
    }
  });

  /* ----- ตรวจคลิปจากไฟล์ ----- */
  pickBtn.addEventListener("click", () => inFile.click());
  inFile.addEventListener("change", () => {
    const f = inFile.files && inFile.files[0];
    fileName.textContent = f ? `เลือกแล้ว: ${f.name}` : "ยังไม่ได้เลือกไฟล์";
    uploadBtn.disabled = !f;
  });
  uploadBtn.addEventListener("click", async () => {
    const f = inFile.files && inFile.files[0];
    if (!f) return;
    uploadBtn.disabled = true;
    uploadBtn.textContent = "กำลังตรวจ...";
    videoResult.textContent = "";
    videoResult.appendChild(spinnerBox("กำลังส่งคลิปและดูให้อยู่ค่ะ ใช้เวลาสัก 1-3 นาที อย่าเพิ่งปิดหน้านี้นะคะ"));
    try {
      const form = new FormData();
      form.append("file", f);
      const res = await fetch(apiBase() + "/api/analyze-video-file", { method: "POST", body: form });
      const d = await res.json();
      if (!res.ok) throw new Error((d && d.error_th) || "ส่งไฟล์ไม่สำเร็จ ลองใหม่นะคะ");
      showVideoResult(d);
    } catch (e) {
      videoResult.textContent = "";
      videoResult.appendChild(errBox(e.message));
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.textContent = "ตรวจไฟล์นี้";
    }
  });
});

    ["ฟัน หู หรือแว่นผิดรูป", "ฟันเบลอเป็นก้อน หูบิดเบี้ยว ต่างหูหรือแว่นวูบหายเวลาขยับหัว"],
    ["แสงและเงาไม่เข้ากับฉาก", "แสงบนใบหน้าทิศทางไม่ตรงกับสภาพแวดล้อม หรือสีผิวเพี้ยนจากคอและมือ"],

        el("span", null, el("b", { text: title }),
          el("span", { class: "muted", style: "display:block;font-weight:400", text: detail })))));

  root.appendChild(eyeBox);
  root.appendChild(el("div", { class: "acc-warn", style: "margin-bottom:8px" },
    "วิธีดูด้วยตาช่วยได้ระดับหนึ่ง แต่คลิปปลอมสมัยใหม่เนียนขึ้นเรื่อย ๆ จนตาคนแยกไม่ออก อย่าใช้ตัดสินอย่างเดียว ให้ยึดกฎทอง 3 ข้อเป็นหลักเสมอ"));

  root.appendChild(el("h2", { text: "9 กลโกงที่ต้องรู้จัก" }));
  const accBox = el("div", null);
  accBox.appendChild(spinnerBox("กำลังโหลด..."));
  root.appendChild(accBox);

  (async function loadPatterns() {
    try {
      const d = await api("/api/scam-patterns");
      accBox.textContent = "";
      for (const p of d.patterns) {
        const item = el("div", { class: "acc-item" });
        const head = el("button", { class: "acc-head", "aria-expanded": "false" },
          el("span", { class: "acc-ic", text: p.icon }),
          el("span", { text: p.name_th }),
          icon("right", "ar"));
        head.addEventListener("click", () => {
          const open = item.classList.toggle("open");
          head.setAttribute("aria-expanded", open ? "true" : "false");
        });
        const body = el("div", { class: "acc-body" },
          el("p", { class: "muted", text: p.description_th }),
          el("div", { class: "acc-warn", text: p.warning_th }));
        item.appendChild(head); item.appendChild(body);
        accBox.appendChild(item);
      }
    } catch (e) {
      accBox.textContent = "";
      accBox.appendChild(errBox("ตอนนี้โหลดข้อมูลไม่ได้ — " + e.message));
    }
  })();

  root.appendChild(el("h2", { text: "ลองทำแบบทดสอบ" }));
  const quizArea = el("div", { id: "quizArea" });
  root.appendChild(quizArea);

  let qIndex = 0, score = 0, answered = false;

  function renderQuestion() {
    quizArea.textContent = "";
    answered = false;
    const item = QUIZ[qIndex];
    const card = el("div", { class: "card" });
    card.appendChild(el("p", { class: "dim", text: `ข้อ ${qIndex + 1} จาก ${QUIZ.length} • ตอบถูกแล้ว ${score} ข้อ` }));
    card.appendChild(el("div", { class: "quiz-progress" },
      el("div", { style: `width:${Math.round((qIndex / QUIZ.length) * 100)}%` })));
    card.appendChild(el("h3", { style: "margin:6px 0 16px", text: item.q }));

    const explainSlot = el("div", null);
    const nextSlot = el("div", null);
    const choiceBtns = [];

    item.choices.forEach((choice, i) => {
      const b = el("button", { class: "quiz-choice", text: choice });
      b.addEventListener("click", () => {
        if (answered) return;
        answered = true;
        const correct = i === item.answer;
        if (correct) score++;
        b.classList.add(correct ? "correct" : "wrong");
        choiceBtns[item.answer].classList.add("correct");
        for (const cb of choiceBtns) cb.disabled = true;

        explainSlot.appendChild(el("div", { class: "quiz-explain " + (correct ? "ok" : "no"),
          text: (correct ? "ถูกต้องค่ะ — " : "ยังไม่ใช่ค่ะ — ") + item.explain }));

        const nextBtn = el("button", { class: "btn", text: qIndex + 1 < QUIZ.length ? "ข้อต่อไป" : "ดูคะแนนรวม" });
        nextBtn.appendChild(icon("right"));
        nextBtn.addEventListener("click", () => {
          qIndex++;
          if (qIndex < QUIZ.length) renderQuestion();
          else renderSummary();
        });
        nextSlot.appendChild(nextBtn);
      });
      choiceBtns.push(b);
      card.appendChild(b);
    });

    card.appendChild(explainSlot);
    card.appendChild(nextSlot);
    quizArea.appendChild(card);
  }

  function renderSummary() {
    quizArea.textContent = "";
    const pct = score / QUIZ.length;
    const verdict = pct === 1 ? "เยี่ยมมาก คุณรู้ทันมิจฉาชีพสุด ๆ" :
      pct >= 0.7 ? "เก่งมาก เกือบเต็มแล้ว" :
      pct >= 0.5 ? "ดีค่ะ ทบทวนอีกนิดจะปลอดภัยขึ้น" :
      "ไม่เป็นไรค่ะ ลองอ่านกลโกงด้านบนแล้วทำใหม่นะคะ";
    const card = el("div", { class: "card center" });
    card.appendChild(el("div", { class: "rule-num", style: "margin:4px auto 14px;width:52px;height:52px;border-radius:16px;font-size:1.2rem", text: `${score}/${QUIZ.length}` }));
    card.appendChild(el("h3", { text: verdict }));
    const retry = el("button", { class: "btn", style: "margin-top:18px", text: "ทำแบบทดสอบใหม่" });
    retry.addEventListener("click", () => { qIndex = 0; score = 0; renderQuestion(); });
    card.appendChild(retry);
    quizArea.appendChild(card);
  }

  renderQuestion();
});

registerPage("chat", (root) => {
  root.appendChild(el("h1", { text: "ผู้ช่วย" }));
  root.appendChild(el("p", { class: "lead", style: "margin-bottom:18px", text: "ถามเรื่องกลโกง คลิปปลอม หรือขอคำแนะนำได้เลยค่ะ" }));

  const messages = el("div", { id: "chatMessages" });
  root.appendChild(messages);

  const inMsg = el("input", { type: "text", placeholder: "พิมพ์คำถามตรงนี้", "aria-label": "พิมพ์คำถาม" });
  const sendBtn = el("button", { class: "btn", "aria-label": "ส่งคำถาม" }, icon("send"));
  root.appendChild(el("div", { class: "chatrow" }, inMsg, sendBtn));

  const history = [];

  function addMsg(role, text) {
    messages.appendChild(el("div", { class: "msg " + (role === "user" ? "user" : "bot"), text }));
    messages.scrollTop = messages.scrollHeight;
    window.scrollTo(0, document.body.scrollHeight);
  }

  addMsg("bot", "สวัสดีค่ะ มีอะไรให้ช่วยไหมคะ\nลองถามเช่น “มีคนโทรมาอ้างเป็นตำรวจ ทำยังไงดี” หรือ “คลิปดาราชวนลงทุน เชื่อได้ไหม”");

  let sending = false;
  async function send() {
    const text = inMsg.value.trim();
    if (!text || sending) return;
    sending = true;
    inMsg.value = "";
    addMsg("user", text);
    const waiting = el("div", { class: "msg bot", text: "กำลังคิดอยู่ค่ะ..." });
    messages.appendChild(waiting);
    try {
      const d = await post("/api/chat", { message: text, history: history.slice(-6) });
      waiting.textContent = d.reply_th;
      history.push({ role: "user", text });
      history.push({ role: "bot", text: d.reply_th });
    } catch (e) {
      waiting.textContent = "ขอโทษค่ะ ตอนนี้ตอบไม่ได้ (" + e.message + ") ลองใหม่อีกครั้งนะคะ";
    } finally {
      sending = false;
      window.scrollTo(0, document.body.scrollHeight);
    }
  }
  sendBtn.addEventListener("click", send);
  inMsg.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
});

/* =====================================================================
   หน้า 6: ของฉัน
===================================================================== */
let refreshMePage = () => {};

registerPage("me", (root) => {
  root.appendChild(el("h1", { text: "ของฉัน" }));

  const userCard = el("div", { class: "card", style: "margin-top:16px" });
  root.appendChild(userCard);

  root.appendChild(el("h2", { text: "สายด่วนที่ควรรู้" }));
  const hotCard = el("div", { class: "card" });
  hotCard.appendChild(el("div", { class: "hotline" },
    el("span", { class: "hotline-num", text: "1441" }),
    el("span", { class: "muted", text: "สายด่วนตำรวจไซเบอร์ แจ้งถูกหลอกออนไลน์และอายัดบัญชี โทรฟรีตลอด 24 ชั่วโมง" })));
  hotCard.appendChild(el("div", { class: "hotline" },
    el("span", { class: "hotline-num", text: "191" }),
    el("span", { class: "muted", text: "เหตุด่วนเหตุร้าย" })));
  root.appendChild(hotCard);

  root.appendChild(el("h2", { text: "การเชื่อมต่อ" }));
  const srvCard = el("div", { class: "card" });
  srvCard.appendChild(el("p", { class: "muted", style: "margin-bottom:12px", text: "ปกติไม่ต้องแก้ ใช้เมื่อผู้ดูแลบอกให้เปลี่ยนเท่านั้น" }));
  const inSrv = el("input", { type: "url", placeholder: "ปล่อยว่าง = ใช้ค่าอัตโนมัติ", "aria-label": "ที่อยู่เซิร์ฟเวอร์" });
  inSrv.value = localStorage.getItem("apiBase") || "";
  const srvMsg = el("p", { class: "muted", style: "margin-top:10px" });
  const srvBtn = el("button", { class: "btn secondary", style: "margin-top:12px", text: "บันทึก" });
  srvBtn.addEventListener("click", async () => {
    const v = inSrv.value.trim().replace(/\/+$/, "");
    if (!v) {
      localStorage.removeItem("apiBase");
      srvMsg.textContent = "กลับไปใช้ค่าอัตโนมัติแล้วค่ะ";
      return;
    }
    srvMsg.textContent = "กำลังทดสอบการเชื่อมต่อ...";
    try {
      const res = await fetch(v + "/api/health");
      if (!res.ok) throw new Error();
      localStorage.setItem("apiBase", v);
      srvMsg.textContent = "เชื่อมต่อได้ บันทึกแล้วค่ะ";
    } catch (e) {
      srvMsg.textContent = "เชื่อมต่อไม่ได้ ตรวจสอบแล้วลองใหม่นะคะ";
    }
  });
  srvCard.appendChild(el("div", { class: "field" }, inSrv));
  srvCard.appendChild(srvBtn);
  srvCard.appendChild(srvMsg);
  root.appendChild(srvCard);

  const outBtn = el("button", { class: "btn danger", style: "margin-top:8px" }, icon("logout"), el("span", { text: "ออกจากระบบ" }));
  outBtn.addEventListener("click", async () => {
    const token = state.token;
    clearAuth();
    if (token) { try { await post("/api/logout", { token }); } catch (e) { /* ไม่เป็นไร */ } }
    showPage("login");
  });
  root.appendChild(outBtn);

  refreshMePage = function () {
    userCard.textContent = "";
    userCard.appendChild(el("div", { class: "rule-card" },
      el("div", { class: "rule-num", style: "background:rgba(14,165,233,.13);border:1px solid rgba(14,165,233,.24);box-shadow:none;color:#7dd3fc" }, icon("user")),
      el("div", null,
        el("h3", { text: state.guest ? "ผู้เยี่ยมชม" : "คุณ" + (state.username || "") }),
        el("p", { class: "muted", style: "margin-top:4px", text: state.guest
          ? "กำลังใช้แบบไม่ได้สมัครสมาชิก สมัครเมื่อไหร่ก็ได้จากหน้าเข้าสู่ระบบ"
          : "เข้าสู่ระบบอยู่" }))));
  };
  refreshMePage();
});

/* =====================================================================
   เริ่มแอป
===================================================================== */
(async function start() {
  if (state.token) {
    try {
      const d = await post("/api/me", { token: state.token });
      state.username = d.username;
      localStorage.setItem("username", d.username);
    } catch (e) {
      if (e.data && e.data.ok === false) clearAuth();
    }
  }
  showPage(isLoggedIn() ? "home" : "cover");
})();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* ไม่รองรับก็ใช้ต่อได้ */ });
}
